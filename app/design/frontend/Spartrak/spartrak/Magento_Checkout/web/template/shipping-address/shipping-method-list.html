<!--
/**
 * Spartrak — the shipping-method list (Figma "Shipping type options",
 * 549:26262 inside "Shipping type container" 549:26260).
 *
 * Core renders the rates as a four-column <table> with a header row of column
 * labels. Figma draws a row of cards and no table at all, so the table is
 * replaced outright rather than restyled — a <table> whose cells are forced to
 * `display: block` is neither the design nor honest markup, and the header row
 * has no equivalent in the design to hide.
 *
 * A LIST is what this actually is: a set of mutually exclusive choices. It is
 * marked up as one, with the radio group living in the item template, so the
 * control stays operable and announceable (CLAUDE.md §15).
 *
 * `#checkout-shipping-method-load` IS PRESERVED. Core's shipping.js and its
 * loader both address that id; renaming it stops the rate list refreshing when
 * the address changes.
 *
 * Geometry (Figma): the row is 720 wide with a 16px gap, so each card is 352 —
 * expressed here as an equal-fraction grid rather than a fixed width, because
 * the number of rates is whatever Magento returns, not always two.
 *
 * ===========================================================================
 * `spartrakDeliveryRates`, NOT `rates`
 * ===========================================================================
 * The pickup carriers quote through Magento like any other carrier, so core's
 * `rates()` contains `استلام من الفرع` and `استلام من الموقف` as well as the two
 * delivery tiers. Bound to `rates()` this list drew all four on the الشحن
 * segment — offering, as cards, the same two choices the segments above the
 * list already offer, and switching the shopper out of the segment they were
 * looking at if they picked one.
 *
 * The delivery-only view is computed in js/view/shipping-mixin.js rather than
 * filtered here: a Knockout template that decides which of Magento's rates
 * count is business logic in markup (CLAUDE.md §8), and the same question is
 * asked by the delivery-mode segments.
 */
-->
<div id="checkout-shipping-method-load">
    <ol class="spartrak-ship-methods" data-bind="foreach: { data: spartrakDeliveryRates(), as: 'method' }">
        <li class="spartrak-ship-methods__item">
            <!-- ko template: { name: element.shippingMethodItemTemplate } --><!-- /ko -->
        </li>
    </ol>
</div>
