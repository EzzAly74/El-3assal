<!--
/**
 * Spartrak — the shipping step.
 *
 * FIGMA SSOT: 549:2753 (delivery), 554:13119 (branch), 554:13750 (depot).
 * All three are the SAME step: a segmented control at the top, then a body
 * that changes with the segment. That is why this is one template with three
 * bodies rather than three screens.
 *
 * ===========================================================================
 * WHAT IS ADDED TO CORE'S TEMPLATE, AND WHAT IS UNTOUCHED
 * ===========================================================================
 * Added, in three places only:
 *
 *   1. the `spartrak-delivery-mode` region, above everything — Figma puts the
 *      segments at y=48, before the address container at y=124;
 *   2. an `if` around the address block, so branch and depot replace the
 *      address book rather than appearing beneath it (inspected, not assumed:
 *      554:13119's "Shipping address container" holds branch rows and no form
 *      fields anywhere in its subtree);
 *   3. the `spartrak-pickup-locations` region, which renders in their place.
 *
 * Everything else is core's, verbatim and load-bearing:
 *
 *   fadeVisible / blockLoader   the step's own show-hide and busy state
 *   getRegion('customer-email') the guest email field. Guest checkout is off
 *                               on this store, but removing the region would
 *                               break the moment a merchant turns it on.
 *   address-list regions        the saved-address cards
 *   isFormInline / showFormPopUp the add-address modal's own trigger and
 *                               visibility, which the desktop modal and the
 *                               mobile bottom sheet both go through
 *   #co-shipping-method-form + submit="setShippingInformation"
 *                               the ONLY path to the next step. The pickup
 *                               flows use it too — they change what is
 *                               selected, never how it is submitted.
 *   rates().length guards       "no quotes available" still shows when a
 *                               carrier declines, including our pickup
 *                               carriers when no locations exist.
 *   errorValidationMessage      server-side errors, including "please choose a
 *                               pickup location" from
 *                               ApplyPickupLocation::resolveLocation
 *
 * `spartrakMode` is added to this component by js/view/shipping-mixin.js.
 */
-->
<li id="shipping" class="checkout-shipping-address" data-bind="fadeVisible: visible()">
    <div class="step-title" translate="'Shipping Address'" data-role="title"></div>
    <div id="checkout-step-shipping"
         class="step-content"
         data-role="content">

        <!-- Figma 554:13250 — the segmented control, above everything. -->
        <each args="getRegion('spartrak-delivery-mode')" render=""></each>

        <each if="!quoteIsVirtual" args="getRegion('customer-email')" render=""></each>

        <!-- ko if: spartrakMode.isDelivery() -->
        <!--
          ===================================================================
          THE ADDRESS BOOK — Figma 549:26266 (list) / 557:4898 (empty)
          ===================================================================
          One header over two mutually exclusive bodies. The header - title at
          the reading start, "عنوان شحن جديد" at the reading end - is present in
          BOTH frames, so it sits outside the branch rather than being written
          twice.

          `showFormPopUp` is core's own method, unchanged: it is what opens the
          address form, and it is the same call core's own "New Address" button
          made. Only the button's appearance moved.
        -->
        <div class="spartrak-address-book">
            <div class="spartrak-address-book__header">
                <h2 class="spartrak-address-book__title" translate="'Choose your shipping address'"></h2>

                <if args="!isFormInline">
                    <button type="button" class="spartrak-address-book__add" click="showFormPopUp">
                        <span translate="'New shipping address'"></span>
                    </button>
                </if>
            </div>

            <!-- ko if: spartrakHasAddresses() -->
            <each args="getRegion('address-list')" render=""></each>
            <each args="getRegion('address-list-additional-addresses')" render=""></each>
            <!-- /ko -->

            <!-- ko ifnot: spartrakHasAddresses() -->
            <div class="spartrak-address-empty">
                <!--
                  Figma 721:29400, drawn as a CSS background rather than an
                  <img>.

                  A Knockout template is fetched as plain text and never passes
                  through PHP, so it has no way to ask Magento where a theme
                  asset ended up - there is no getViewFileUrl() here. The two
                  honest options are to publish the URL from the component, or
                  to let LESS resolve it at compile time. LESS wins: the path is
                  resolved once at deploy instead of on every render, and it
                  costs no JavaScript at all.

                  A CSS background is only acceptable BECAUSE the van is purely
                  decorative - the heading beside it carries the meaning, so
                  there is nothing for alt text to say. It is a fixed 176 square,
                  so it reserves its own space and cannot shift the panel.
                -->
                <span class="spartrak-address-empty__art" aria-hidden="true"></span>
                <div class="spartrak-address-empty__body">
                    <p class="spartrak-address-empty__title" translate="'You have no shipping address!'"></p>
                    <p class="spartrak-address-empty__lead"
                       translate="'Start by adding your shipping addresses so you can receive your products easily.'"></p>
                    <button type="button" class="spartrak-address-empty__cta" click="showFormPopUp">
                        <span translate="'Add a new shipping address'"></span>
                    </button>
                </div>
            </div>
            <!-- /ko -->
        </div>

        <!-- Address form pop up -->
        <if args="!isFormInline">
            <div id="opc-new-shipping-address"
                 visible="isFormPopUpVisible()"
                 render="shippingFormTemplate"></div>
        </if>

        <each args="getRegion('before-form')" render=""></each>

        <!-- Inline address form -->
        <render if="isFormInline" args="shippingFormTemplate"></render>
        <!-- /ko -->

        <!-- Figma 554:13119 / 554:13750 — branch and depot replace the above. -->
        <each args="getRegion('spartrak-pickup-locations')" render=""></each>
    </div>
</li>

<!--Shipping method template-->
<li id="opc-shipping_method"
    class="checkout-shipping-method"
    data-bind="fadeVisible: visible(), blockLoader: isLoading"
    role="presentation">
    <div class="checkout-shipping-method">
        <div class="step-title"
             translate="'Shipping Methods'"
             data-role="title"></div>

        <each args="getRegion('before-shipping-method-form')" render=""></each>

        <div id="checkout-step-shipping_method"
             class="step-content"
             data-role="content"
             role="tabpanel"
             aria-hidden="false">
            <form id="co-shipping-method-form"
                  class="form methods-shipping"
                  if="rates().length"
                  submit="setShippingInformation"
                  novalidate="novalidate">

                <!--
                  The method cards are a DELIVERY concern. Figma's pickup
                  frames draw no shipping-method cards at all — the location IS
                  the method — so the list is hidden on those segments while
                  the form around it, and its submit, stay exactly where they
                  were.
                -->
                <!-- ko if: spartrakMode.isDelivery() -->
                <render args="shippingMethodListTemplate"></render>
                <!-- /ko -->

                <div id="onepage-checkout-shipping-method-additional-load">
                    <each args="getRegion('shippingAdditional')" render=""></each>
                </div>
                <div role="alert"
                     if="errorValidationMessage().length"
                     class="message notice">
                    <span text="errorValidationMessage()"></span>
                </div>
                <div class="actions-toolbar" id="shipping-method-buttons-container">
                    <div class="primary">
                        <button data-role="opc-continue" type="submit" class="button action continue primary">
                            <span translate="'Next'"></span>
                        </button>
                    </div>
                </div>
            </form>
            <div class="no-quotes-block"
                 ifnot="rates().length > 0"
                 translate="'Sorry, no quotes are available for this order at this time'"></div>
        </div>
    </div>
</li>
