<!--
/**
 * Spartrak shipping row - Figma 551:11182.
 *
 * Free shipping renders in `text/success` with the `(مجانا)` suffix, which is
 * the carrier's own rate title as Spartrak_Shipping builds it - not a string
 * this template invents when the number happens to be zero.
 *
 * The `isCalculated()` branch is core's and is kept: before a shipping method
 * is chosen there is no amount, and printing a stale or zero figure there
 * would be a lie about what the shopper is about to pay.
 */
-->
<!-- ko if: quoteIsVirtual == 0 -->
<div class="spartrak-total spartrak-total--shipping"
     data-bind="css: { 'spartrak-total--free': spartrakIsFree() }">
    <span class="spartrak-total__label" data-bind="i18n: title"></span>
    <!-- ko if: isCalculated() -->
    <span class="spartrak-total__value" data-bind="text: getValue()"></span>
    <!-- /ko -->
    <!-- ko ifnot: isCalculated() -->
    <span class="spartrak-total__value spartrak-total__value--pending" data-bind="text: getValue()"></span>
    <!-- /ko -->
</div>
<!-- /ko -->
