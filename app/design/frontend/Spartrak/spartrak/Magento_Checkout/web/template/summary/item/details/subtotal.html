<!--
/**
 * Spartrak summary item price - Figma 551:11121 (Price/Base 18/700, text/brand).
 *
 * Only the class differs from core. The value is still `getValue($parents[1])`
 * - the row subtotal Magento already calculated - so the number itself, its
 * currency and its formatting stay entirely Magento's.
 */
-->
<span class="spartrak-summary-item__price" data-bind="text: getValue($parents[1])"></span>
