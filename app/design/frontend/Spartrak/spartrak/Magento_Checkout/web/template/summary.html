<!--
/**
 * Spartrak order summary card - Figma 551:11106 (528 x auto).
 *
 * The card: white, no border, Shadow/Medium Darker, 8px outer padding, and an
 * inner block padded 24 with a 28px rhythm between title, body and CTA - all
 * measured off the frame, where the inner container's 664px height is exactly
 * 24 + 26 + 28 + 486 + 28 + 48 + 24.
 *
 * ===========================================================================
 * CORE'S `blockLoader: isLoading` IS DROPPED, AND IT IS NOT A LOSS OF FEEDBACK
 * ===========================================================================
 * It was kept in the first pass on the argument that it was the only signal
 * during a totals refresh. Watched on the live checkout, it is not the only
 * one — it is the second or third:
 *
 *   apply / remove a coupon   Magento_SalesRule's set-coupon-code and
 *                             cancel-coupon both drive full-screen-loader, so
 *                             the page-level modal is already up when this
 *                             column starts recollecting.
 *   continue to payment       shipping-save-processor/default does the same.
 *   change address or rate    the shipping-method step shows its own loader,
 *                             which is where the shopper is looking.
 *
 * So every path that sets `isLoading` here already paints an overlay somewhere
 * the shopper can see, and this one added a second dimmed panel on top of it.
 * Figma draws one processing state for the whole checkout (554:11231) and no
 * loading treatment on this card at all — which is also CLAUDE.md §10: the
 * loader is one global thing, not one per surface.
 *
 * Nothing about Magento's loading BEHAVIOUR changed: `totals.isLoading` is
 * still set and cleared exactly as before, and any other consumer of it still
 * sees it. Only this card stopped rendering a mask for it.
 */
-->
<div class="opc-block-summary spartrak-summary">
  <div class="spartrak-summary__inner">
    <!--
          `Order summary`, not `Order details`.

          The desktop frame (551:11109) labels this card `تفاصيل الطلب` and the
          mobile one (687:16474) labels it `ملخص الطلب`. Two names for one
          element across two mocks of the same screen is drift, not intent, so
          one string is used - and it is the mobile one, because the CART's
          summary card uses the same words and a shopper meets that first.
        -->
    <p class="spartrak-summary__title" data-bind="i18n: 'Order summary'"></p>

    <!--
          `elems()` renders EVERY child of the summary, whatever displayArea it
          declares - the item list, the totals, and the CTA alike.

          There was a second `getRegion('spartrak-place-order')` loop here, and
          it was wrong: the CTA is a child of this component, so it was already
          in elems(), and the page drew two identical buttons stacked on top of
          each other.

          Its position is settled by `sortOrder` in Spartrak_Checkout's
          checkout_index_index.xml instead - which is how every other total in
          this column orders itself, and is the value a merchant's own
          "Checkout Totals Sort Order" setting already speaks to.
        -->
    <!-- ko foreach: elems() -->
    <!-- ko template: getTemplate() --><!-- /ko -->
    <!-- /ko -->
  </div>
</div>
